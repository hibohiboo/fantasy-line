name: SonarQube Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: sonar-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"

jobs:
  sonarqube:
    name: SonarQube Scan
    runs-on: ubuntu-latest
    # SonarQube Cloud の Secrets が設定されている場合のみ実行
    if: vars.SONAR_PROJECT_KEY != ''
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # SonarQube のブランチ比較に必要

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run API tests with coverage
        run: npm run test --workspace=apps/api -- --coverage
        continue-on-error: true

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL || 'https://sonarcloud.io' }}
        with:
          args: >
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
            -Dsonar.organization=${{ vars.SONAR_ORG }}
            -Dsonar.sources=apps,packages,infra
            -Dsonar.tests=apps,packages,infra
            -Dsonar.test.inclusions=**/*.test.ts,**/*.spec.ts
            -Dsonar.exclusions=**/node_modules/**,**/dist/**,**/out/**
            -Dsonar.javascript.lcov.reportPaths=apps/api/coverage/lcov.info,apps/frontend/coverage/lcov.info
