name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "デプロイ先環境"
        required: true
        default: "production"
        type: choice
        options:
          - production
      confirm:
        description: "本番デプロイを確認 (yes と入力)"
        required: true
        type: string

env:
  NODE_VERSION: "24"

jobs:
  validate-input:
    name: Validate deploy inputs
    runs-on: ubuntu-latest
    steps:
      - name: Confirm deploy
        if: inputs.confirm != 'yes'
        run: |
          echo "::error::デプロイの確認が取れませんでした。'yes' と入力してください。"
          exit 1

  build:
    name: Build artifacts
    needs: validate-input
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build --workspace=apps/frontend

      - name: Upload web artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: apps/frontend/dist/
          retention-days: 1

  cdk-deploy:
    name: CDK Deploy (${{ inputs.environment }})
    needs: build
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install infra dependencies
        working-directory: infra
        run: npm ci

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-northeast-1

      - name: CDK Synth (validate before deploy)
        working-directory: infra
        run: npm run synth

      - name: CDK Deploy
        working-directory: infra
        run: npx cdk deploy --require-approval never --all
        env:
          CDK_DEFAULT_ACCOUNT: ${{ secrets.AWS_ACCOUNT_ID }}
          CDK_DEFAULT_REGION: ap-northeast-1

  s3-deploy:
    name: S3 Deploy (Web)
    needs: [build, cdk-deploy]
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download web artifact
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: dist/

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-northeast-1

      - name: Sync to S3
        run: |
          aws s3 sync dist/ s3://${{ secrets.WEB_S3_BUCKET_NAME }}/ \
            --delete \
            --cache-control "public, max-age=31536000, immutable" \
            --exclude "*.html" \
            --exclude "*.txt"
          aws s3 sync dist/ s3://${{ secrets.WEB_S3_BUCKET_NAME }}/ \
            --delete \
            --cache-control "no-cache" \
            --include "*.html" \
            --include "*.txt"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"
