openapi: 3.1.0
info:
  title: Fantasy Line API
  version: 0.1.0
  description: ファンタジー世界の村管理サービス API

servers:
  - url: https://{apiId}.execute-api.ap-northeast-1.amazonaws.com/prod
    description: 本番環境 (AWS API Gateway)
    variables:
      apiId:
        default: xxxxxxxxxx
  - url: http://localhost:5173
    description: ローカル開発環境 (Vite dev server + proxy → SAM Local or MSW)

paths:
  /api/echo:
    get:
      summary: エコー（疎通確認用）
      operationId: echo
      parameters:
        - in: query
          name: message
          schema:
            type: string
      responses:
        '200':
          description: クエリパラメータをそのまま返す
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string

  /api/residents:
    post:
      summary: 住人を登録する
      operationId: createResident
      description: ログイン中のユーザーが管理する村に住人を新規登録する。villageId の村が存在しない、または権限がない場合は 403 を返す
      x-pbi: PBI-003
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateResidentInput'
            examples:
              normal:
                summary: 通常リクエスト
                value:
                  name: タロウ
                  nameKana: タロウ
                  birthDate: '2000-01-15'
                  villageId: 1
      responses:
        '201':
          description: 住人の登録成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateResidentResponse'
              examples:
                created:
                  summary: 登録成功レスポンス
                  value:
                    resident:
                      id: 1
                      name: タロウ
                      nameKana: タロウ
                      birthDate: '2000-01-15'
                      villageId: 1
                      createdAt: '2026-05-06T00:00:00.000Z'
        '400':
          description: バリデーションエラーまたはJSONパース失敗
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ValidationErrorResponse'
                  - $ref: '#/components/schemas/SimpleErrorResponse'
              examples:
                emptyName:
                  summary: 名前が空の場合
                  value:
                    error:
                      fieldErrors:
                        name:
                          - String must contain at least 1 character(s)
                invalidKana:
                  summary: 読みがカタカナ以外の場合
                  value:
                    error:
                      fieldErrors:
                        nameKana:
                          - 読みはカタカナで入力してください
                missingVillageId:
                  summary: villageId がない場合
                  value:
                    error:
                      fieldErrors:
                        villageId:
                          - Required
                invalidJson:
                  summary: JSONが不正な場合
                  value:
                    error: Invalid JSON
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

    get:
      summary: 全住人一覧を取得する
      operationId: listResidents
      description: ログイン中のユーザーが管理するすべての村の住人を、読み（nameKana）の昇順で返す
      x-pbi: PBI-003
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 住人一覧の取得成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListResidentsResponse'
              examples:
                withResidents:
                  summary: 住人が存在する場合
                  value:
                    residents:
                      - id: 1
                        name: アキコ
                        nameKana: アキコ
                        birthDate: '1995-03-10'
                        villageId: 1
                        villageName: エルムの村
                        createdAt: '2026-05-06T00:00:00.000Z'
                      - id: 2
                        name: タロウ
                        nameKana: タロウ
                        birthDate: '2000-01-15'
                        villageId: 1
                        villageName: エルムの村
                        createdAt: '2026-05-06T01:00:00.000Z'
                empty:
                  summary: 住人が存在しない場合
                  value:
                    residents: []
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/villages/{id}/residents:
    get:
      summary: 村別住人一覧を取得する
      operationId: listVillageResidents
      description: 指定した村に所属する住人を読み（nameKana）の昇順で返す。村の所有者以外は 403 を返す
      x-pbi: PBI-003
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: 村ID
      responses:
        '200':
          description: 村別住人一覧の取得成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListVillageResidentsResponse'
              examples:
                withResidents:
                  summary: 住人が存在する場合
                  value:
                    residents:
                      - id: 1
                        name: アキコ
                        nameKana: アキコ
                        birthDate: '1995-03-10'
                        villageId: 1
                        createdAt: '2026-05-06T00:00:00.000Z'
                empty:
                  summary: 住人が存在しない場合
                  value:
                    residents: []
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/villages:
    post:
      summary: 村を作成する
      operationId: createVillage
      description: ログイン中のユーザーを管理者として村を新規作成する
      x-pbi: PBI-001
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateVillageInput'
            examples:
              normal:
                summary: 通常リクエスト
                value:
                  name: エルムの村
      responses:
        '201':
          description: 村の作成成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateVillageResponse'
              examples:
                created:
                  summary: 作成成功レスポンス
                  value:
                    village:
                      id: 1
                      name: エルムの村
                      ownerId: 1
                      createdAt: '2026-05-05T00:00:00.000Z'
        '400':
          description: バリデーションエラーまたはJSONパース失敗
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ValidationErrorResponse'
                  - $ref: '#/components/schemas/SimpleErrorResponse'
              examples:
                emptyName:
                  summary: 村名が空の場合
                  value:
                    error:
                      fieldErrors:
                        name:
                          - String must contain at least 1 character(s)
                invalidJson:
                  summary: JSONが不正な場合
                  value:
                    error: Invalid JSON
        '401':
          $ref: '#/components/responses/Unauthorized'

    get:
      summary: 自分の村一覧を取得する
      operationId: listVillages
      description: 現在のテナントスキーマ内でログイン中のユーザーが作成した村の一覧を、作成日時の降順（最新順）で返す。テナントコンテキストは tenantContext ミドルウェアが解決する
      x-pbi: PBI-001
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XTenantId'
      responses:
        '200':
          description: 村一覧の取得成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListVillagesResponse'
              examples:
                withVillages:
                  summary: 村が存在する場合
                  value:
                    villages:
                      - id: 2
                        name: オークの村
                        ownerId: 1
                        createdAt: '2026-05-06T00:00:00.000Z'
                      - id: 1
                        name: エルムの村
                        ownerId: 1
                        createdAt: '2026-05-05T00:00:00.000Z'
                empty:
                  summary: 村が存在しない場合
                  value:
                    villages: []
        '401':
          $ref: '#/components/responses/Unauthorized'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Cognito JWT トークン。以下の custom claims を含む。
        - custom:user_type: "tenant_admin" | "tenant_user" | "servicer_admin" | "servicer_delegate"
        - custom:tenant_id: テナントスラッグ（tenant_* ユーザーのみ）

  schemas:
    CreateResidentInput:
      type: object
      required:
        - name
        - nameKana
        - birthDate
        - villageId
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
          description: 住人名（1〜128文字）
          example: タロウ
        nameKana:
          type: string
          minLength: 1
          maxLength: 128
          pattern: '^[ァ-ヴー]+$'
          description: 読み（全角カタカナのみ、1〜128文字）
          example: タロウ
        birthDate:
          type: string
          format: date
          description: 生年月日（YYYY-MM-DD 形式）
          example: '2000-01-15'
        villageId:
          type: integer
          minimum: 1
          description: 所属村ID
          example: 1

    Resident:
      type: object
      required:
        - id
        - name
        - nameKana
        - birthDate
        - villageId
        - createdAt
      properties:
        id:
          type: integer
          description: 住人の一意識別子
          example: 1
        name:
          type: string
          description: 住人名
          example: タロウ
        nameKana:
          type: string
          description: 読み（全角カタカナ）
          example: タロウ
        birthDate:
          type: string
          description: 生年月日（YYYY-MM-DD 形式）
          example: '2000-01-15'
        villageId:
          type: integer
          description: 所属村ID
          example: 1
        createdAt:
          type: string
          format: date-time
          description: 作成日時（ISO 8601）
          example: '2026-05-06T00:00:00.000Z'

    ResidentWithVillage:
      allOf:
        - $ref: '#/components/schemas/Resident'
        - type: object
          required:
            - villageName
          properties:
            villageName:
              type: string
              description: 所属村名
              example: エルムの村

    CreateResidentResponse:
      type: object
      required:
        - resident
      properties:
        resident:
          $ref: '#/components/schemas/Resident'

    ListResidentsResponse:
      type: object
      required:
        - residents
      properties:
        residents:
          type: array
          items:
            $ref: '#/components/schemas/ResidentWithVillage'

    ListVillageResidentsResponse:
      type: object
      required:
        - residents
      properties:
        residents:
          type: array
          items:
            $ref: '#/components/schemas/Resident'

    CreateVillageInput:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
          description: 村名（1〜128文字）
          example: エルムの村

    Village:
      type: object
      required:
        - id
        - name
        - ownerId
        - createdAt
      properties:
        id:
          type: integer
          description: 村の一意識別子
          example: 1
        name:
          type: string
          description: 村名
          example: エルムの村
        ownerId:
          type: integer
          description: 村を作成したテナントユーザーの ID（tenant_{slug}.users.id への参照）
          example: 1
        createdAt:
          type: string
          format: date-time
          description: 作成日時（ISO 8601）
          example: '2026-05-05T00:00:00.000Z'

    CreateVillageResponse:
      type: object
      required:
        - village
      properties:
        village:
          $ref: '#/components/schemas/Village'

    ListVillagesResponse:
      type: object
      required:
        - villages
      properties:
        villages:
          type: array
          items:
            $ref: '#/components/schemas/Village'

    ValidationErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          properties:
            fieldErrors:
              type: object
              additionalProperties:
                type: array
                items:
                  type: string
            formErrors:
              type: array
              items:
                type: string

    SimpleErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: string

  responses:
    Unauthorized:
      description: 未認証
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SimpleErrorResponse'
          example:
            error: Unauthorized

    Forbidden:
      description: 権限なし
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SimpleErrorResponse'
          example:
            error: Forbidden

    ServiceUnavailable:
      description: テナントスキーマが存在しない、または DB 接続に失敗した
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SimpleErrorResponse'
          example:
            error: Service Unavailable

  parameters:
    XTenantId:
      in: header
      name: X-Tenant-Id
      schema:
        type: string
      required: false
      description: |
        対象テナントのスラッグ。servicer_* ユーザーのリクエストでは必須。
        tenant_* ユーザーのリクエストでは JWT の custom:tenant_id が優先されるため無視される。
      example: acme
